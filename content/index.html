    }
  }
  // Krümmung je Position
  const pn = new Float32Array(nP * 3);
  for (let t = 0; t < nT; t++) for (let k = 0; k < 3; k++) { const p = pid[I[t * 3 + k]]; for (let c = 0; c < 3; c++) pn[p * 3 + c] += fn[t * 3 + c] * fa[t]; }
  for (let p = 0; p < nP; p++) { const n = V3.norm([pn[p * 3], pn[p * 3 + 1], pn[p * 3 + 2]]); pn.set(n, p * 3); }
  const kap = new Float32Array(nP), kc = new Float32Array(nP);
  for (let e = 0; e < edgeList.length; e += 2) {
    const a = edgeList[e], b = edgeList[e + 1], ia = pRep[a] * 3, ib = pRep[b] * 3;
    const d = [P[ib] - P[ia], P[ib + 1] - P[ia + 1], P[ib + 2] - P[ia + 2]]; const L2 = V3.dot(d, d);
    if (L2 < 1e-14) continue;
    kap[a] += -2 * (pn[a * 3] * d[0] + pn[a * 3 + 1] * d[1] + pn[a * 3 + 2] * d[2]) / L2; kc[a]++;
    kap[b] += 2 * (pn[b * 3] * d[0] + pn[b * 3 + 1] * d[1] + pn[b * 3 + 2] * d[2]) / L2; kc[b]++;
  }
  for (let p = 0; p < nP; p++) kap[p] = kc[p] ? clamp(2 * kap[p] / kc[p], -120, 120) : 0; // 2× Mittelwert: Kante = 1/Radius

  // Gruppen für das Füll-Werkzeug
  const partUF = new UF(nP);
  for (let t = 0; t < nT; t++) { partUF.union(pid[I[t * 3]], pid[I[t * 3 + 1]]); partUF.union(pid[I[t * 3]], pid[I[t * 3 + 2]]); }
  const uvKey = new Map(); const islUF = new UF(nT);
  for (let t = 0; t < nT; t++) for (let k = 0; k < 3; k++) {
    const key = Math.round(CU[t * 6 + k * 2] * 65536) + ',' + Math.round(CU[t * 6 + k * 2 + 1] * 65536) + ',' + pid[I[t * 3 + k]];
    const o = uvKey.get(key); if (o === undefined) uvKey.set(key, t); else islUF.union(t, o);
  }
  const groups = { part: new Int32Array(nT), island: new Int32Array(nT), planar: new Int32Array(nT) };
  for (let t = 0; t < nT; t++) { groups.part[t] = partUF.find(pid[I[t * 3]]); groups.island[t] = islUF.find(t); groups.planar[t] = planarUF.find(t); }

  // Dreiecks-Suppe für die Grafikkarte
  const n3 = nT * 3;
  const S = {
    pos: new Float32Array(n3 * 3), nrm: CN, uv: CU, bary: new Float32Array(n3 * 3),
    alt: new Float32Array(n3 * 3), cvx: new Float32Array(n3 * 3), ccv: new Float32Array(n3 * 3), curv: new Float32Array(n3),
  };
  for (let t = 0; t < nT; t++) {
    const ps = [0, 1, 2].map((k) => I[t * 3 + k] * 3);
    const L = [0, 1, 2].map((k) => { const a = ps[(k + 1) % 3], b = ps[(k + 2) % 3]; return Math.hypot(P[a] - P[b], P[a + 1] - P[b + 1], P[a + 2] - P[b + 2]) || 1e-9; });
    for (let k = 0; k < 3; k++) {
      const o = (t * 3 + k) * 3;
      S.pos[o] = P[ps[k]]; S.pos[o + 1] = P[ps[k] + 1]; S.pos[o + 2] = P[ps[k] + 2];
      S.bary[o + k] = 1;
      for (let j = 0; j < 3; j++) { S.alt[o + j] = 2 * fa[t] / L[j]; S.cvx[o + j] = cvx[t * 3 + j]; S.ccv[o + j] = ccv[t * 3 + j]; }
      S.curv[t * 3 + k] = kap[pid[I[t * 3 + k]]];
    }
  }
  return { name: name || 'Modell', nT, soup: S, groups, autoUV, ctr, rad };
}

/* Automatische UVs: Box-Projektion, Inseln nebeneinander packen */
function makeAutoUV(P, I, fn, fa, pid, nP, nT) {
  const ax = new Int8Array(nT);
  for (let t = 0; t < nT; t++) {
    const n = [fn[t * 3], fn[t * 3 + 1], fn[t * 3 + 2]]; let a = 0;
    if (Math.abs(n[1]) > Math.abs(n[a])) a = 1; if (Math.abs(n[2]) > Math.abs(n[a])) a = 2;
    ax[t] = a * 2 + (n[a] < 0 ? 1 : 0);
  }
  const uf = new UF(nT); const first = new Map();
  for (let t = 0; t < nT; t++) for (let k = 0; k < 3; k++) {
    const key = pid[I[t * 3 + k]] * 6 + ax[t]; const o = first.get(key);
    if (o === undefined) first.set(key, t); else uf.union(t, o);
  }
  const CU = new Float32Array(nT * 6);
  const proj = [[2, 1, -1], [2, 1, 1], [0, 2, -1], [0, 2, 1], [0, 1, 1], [0, 1, -1]];
  for (let t = 0; t < nT; t++) {
    const [a, b, s] = proj[ax[t]];
    for (let k = 0; k < 3; k++) { const v = I[t * 3 + k] * 3; CU[t * 6 + k * 2] = P[v + a] * s; CU[t * 6 + k * 2 + 1] = P[v + b]; }
  }
  const charts = new Map();
  for (let t = 0; t < nT; t++) {
    const r = uf.find(t); let c = charts.get(r);
    if (!c) { c = { tris: [], mn: [Infinity, Infinity], mx: [-Infinity, -Infinity] }; charts.set(r, c); }
    c.tris.push(t);
    for (let k = 0; k < 3; k++) for (let j = 0; j < 2; j++) { const v = CU[t * 6 + k * 2 + j]; if (v < c.mn[j]) c.mn[j] = v; if (v > c.mx[j]) c.mx[j] = v; }
  }
  const list = [...charts.values()]; let area = 0;
  for (const c of list) { c.w = c.mx[0] - c.mn[0] + 1e-6; c.h = c.mx[1] - c.mn[1] + 1e-6; area += c.w * c.h; }
  list.sort((a, b) => b.h - a.h);
  const pad = Math.sqrt(area) * 0.012, rowW = Math.sqrt(area) * 1.25;
  let x = 0, y = 0, rowH = 0, W = 0;
  for (const c of list) {
    if (x > 0 && x + c.w > rowW) { x = 0; y += rowH + pad; rowH = 0; }
    c.ox = x; c.oy = y; x += c.w + pad; rowH = Math.max(rowH, c.h); W = Math.max(W, x);
  }
  const Ht = y + rowH; const sc = 0.98 / Math.max(W, Ht);
  for (const c of list) for (const t of c.tris) for (let k = 0; k < 3; k++) {
    CU[t * 6 + k * 2] = 0.01 + (CU[t * 6 + k * 2] - c.mn[0] + c.ox) * sc;
    CU[t * 6 + k * 2 + 1] = 0.01 + (CU[t * 6 + k * 2 + 1] - c.mn[1] + c.oy) * sc;
  }
  return CU;
}

/* Pinsel-Material einmal als Textur berechnen */

/* ---------- Modell hochladen ---------- */
function uploadMesh(mesh) {
  if (E.vao) { gl.deleteVertexArray(E.vao); E.bufs.forEach((b) => gl.deleteBuffer(b)); E.bufs = []; }
  const s = mesh.soup;
  E.vao = gl.createVertexArray(); gl.bindVertexArray(E.vao);
  [[s.pos, 3], [s.nrm, 3], [s.uv, 2], [s.bary, 3], [s.alt, 3], [s.cvx, 3], [s.ccv, 3], [s.curv, 1]].forEach(([arr, n], loc) => {
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, n, gl.FLOAT, false, 0, 0); E.bufs.push(b);
  });
  gl.bindVertexArray(null);
  E.nVerts = mesh.nT * 3;
  E.idxBuf = E.idxBuf || gl.createBuffer();
}
function drawSoup() { gl.bindVertexArray(E.vao); gl.drawArrays(gl.TRIANGLES, 0, E.nVerts); }

function clearTex(t, rgba, i = 0) { bindTargets([t]); gl.clearBufferfv(gl.COLOR, i, rgba); }
function copyTex(src, w = src.w, h = src.h, fmt = src.fmt) {
  const t = new Tex(w, h, fmt);
  bindTargets([t]); E.P.copy.use().tex('uSrc', src); gl.disable(gl.BLEND); drawFull();
  return t;
}
function trackTex(t) { E.layerTex.add(t); return t; }
function newPaintTex(res = S.res) {
  const c = trackTex(new Tex(res, res, 'rgba8')), m = trackTex(new Tex(res, res, 'rgba16f'));
  clearTex(c, [0, 0, 0, 0]); clearTex(m, [0, 0, 0, 0]);
  return { c, m };
}
function newMaskTex(val, res = S.res) { const t = trackTex(new Tex(res, res, 'r8')); clearTex(t, [val, val, val, val]); return t; }

/* ---------- Ziel (Textursatz) und Backen ---------- */
function makeAcc(size) { return [0, 1].map(() => ({ c: new Tex(size, size, 'rgba8'), m: new Tex(size, size, 'rgba16f') })); }
function freeTarget(T) {
  if (!T) return;
  ['pos', 'nrm', 'bake', 'vn'].forEach((k) => T[k] && T[k].free());
  T.acc.forEach((a) => { a.c.free(); a.m.free(); });
  for (const c of T.caches.values()) freeCache(c);
  T.caches.clear();
}
function freeCache(c) { ['c', 'm', 'g'].forEach((k) => { if (c[k]) { c[k].free(); c[k] = null; } }); }

function bakeMesh(progress) {
  const res = S.res, P = E.P;
  freeTarget(E.T);
  if (E.fin) { E.fin.c.free(); E.fin.m.free(); E.fin.n.free(); }
  if (E.isl) E.isl.free();
  if (E.stroke) E.stroke.free();
  if (E.strokeCol) E.strokeCol.free();
  if (E.bmat) { E.bmat.c.free(); E.bmat.m.free(); E.bmat = null; }
  if (E.sel) { E.sel.free(); E.sel = null; }
  for (const c of E.caches.values()) freeCache(c);
  E.caches.clear();
  const T = { size: res, pos: new Tex(res, res, 'rgba32f'), nrm: new Tex(res, res, 'rgba16f'), bake: new Tex(res, res, 'rgba16f'), acc: makeAcc(res), caches: E.caches };
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND); gl.disable(gl.SCISSOR_TEST); gl.disable(gl.CULL_FACE);

  // Umgebungsverdeckung (AO) aus vielen Richtungen
  const aoAcc = new Tex(res, res, 'rgba16f'); clearTex(aoAcc, [0, 0, 0, 0]);
  const depth = new Tex(1024, 1024, 'rgba32f');
  const ND = E.nVerts > 900000 ? 24 : 40;
  for (let i = 0; i < ND; i++) {
    const y = 1 - (i + 0.5) / ND * 2, r = Math.sqrt(1 - y * y), ph = i * 2.39996323;
    const dir = [Math.cos(ph) * r, y, Math.sin(ph) * r];
    const view = M4.lookAt(V3.mul(dir, 3), [0, 0, 0], Math.abs(y) > 0.99 ? [1, 0, 0] : [0, 1, 0]);
    const VP = M4.mul(M4.ortho(-1.05, 1.05, -1.05, 1.05, 0.5, 5.5), view);
    bindTargets([depth], true);
    gl.clearBufferfv(gl.COLOR, 0, [1, 1, 1, 1]); gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    P.aoDepth.use().set('uVP', VP); drawSoup();
    gl.disable(gl.DEPTH_TEST);
    bindTargets([aoAcc]); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    P.aoAcc.use().tex('uDepth', depth).set('uVP', VP).set('uDir', dir); drawSoup();
    gl.disable(gl.BLEND);
  }
  depth.free();
  if (progress) progress('Kanten und Krümmung …');
  // Position, Normale, Kanten, Krümmung, AO
  bindTargets([T.pos, T.nrm, T.bake]);
  gl.clearBufferfv(gl.COLOR, 0, [0, 0, 0, 0]); gl.clearBufferfv(gl.COLOR, 1, [0, 1, 0, 0]); gl.clearBufferfv(gl.COLOR, 2, [1000, 1000, 0, 1]);
  P.geo.use().tex('uAO', aoAcc); drawSoup();
  aoAcc.free();
  // Ränder auffüllen: nächstes Texel jeder UV-Insel (Jump Flooding)
  let a = new Tex(res, res, 'rgba32f'), b = new Tex(res, res, 'rgba32f');
  bindTargets([a]); P.jfaInit.use().tex('uPos', T.pos); drawFull();
  for (let st = res / 2; st >= 1; st /= 2) { bindTargets([b]); P.jfa.use().tex('uSrc', a).set('uStep', st); drawFull(); [a, b] = [b, a]; }
  bindTargets([b]); P.jfa.use().tex('uSrc', a).set('uStep', 1); drawFull(); [a, b] = [b, a];
  b.free(); E.isl = a;
  E.T = T;
  E.fin = { c: new Tex(res, res, 'rgba8'), m: new Tex(res, res, 'rgba16f'), n: new Tex(res, res, 'rgba8') };
  E.stroke = new Tex(res, res, 'r8');
  E.strokeCol = new Tex(res, res, 'rgba8');
  cleanFBOs();
  E.needComp = true;
}

/* ---------- Ebenen-Caches (Füllmuster und Masken-Generatoren) ---------- */
function setPatternUniforms(p, f) {
  p.set('uPat', f.pat | 0).set('uColA', hex2rgb(f.colA)).set('uColB', hex2rgb(f.colB))
    .set('uRoughA', f.roughA).set('uRoughB', f.roughB).set('uMetalA', f.metalA).set('uMetalB', f.metalB)
    .set('uHAmt', f.hAmt).set('uScale', f.scale).set('uVar', f.vari).set('uSeed', f.seed);
}
function setGenUniforms(p, m) {
  p.set('uGen', m.gen | 0).set('uGLevel', m.level).set('uGWidth', m.width).set('uGRough', m.rough)
    .set('uGSoft', m.soft).set('uGScale', m.scale).set('uGSeed', m.seed).set('uGInv', !!m.inv);
}
const genKey = (m) => JSON.stringify([m.gen, m.level, m.width, m.rough, m.soft, m.scale, m.seed, m.inv]);
function getCache(T, l) {
  let c = T.caches.get(l.id);
  if (!c) { c = {}; T.caches.set(l.id, c); }
  if (l.kind === 'fill') {
    const h = JSON.stringify(l.fill);
    if (c.fh !== h) {
      if (!c.c) { c.c = new Tex(T.size, T.size, 'rgba8'); c.m = new Tex(T.size, T.size, 'rgba16f'); }
      bindTargets([c.c, c.m]); const p = fillProg(l.fill.pat | 0).use(); setPatternUniforms(p, l.fill);
      p.tex('uPos', T.pos).tex('uNrm', T.nrm); drawFull(); c.fh = h;
    }
  }
  if (l.mask && l.mask.gen) {
    const h = genKey(l.mask);
    if (c.gh !== h) {
      if (!c.g) c.g = new Tex(T.size, T.size, 'r8');
      bindTargets([c.g]); const p = genProg(l.mask.gen | 0).use(); setGenUniforms(p, l.mask);
      p.tex('uPos', T.pos).tex('uNrm', T.nrm).tex('uBake', T.bake); drawFull(); c.gh = h;
    }
  }
  return c;
}

function compositeTarget(T, layers) {
  const P = E.P; gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST); gl.disable(gl.SCISSOR_TEST);
  let cur = 0;
  bindTargets([T.acc[0].c, T.acc[0].m]);
  gl.clearBufferfv(gl.COLOR, 0, BASE_C); gl.clearBufferfv(gl.COLOR, 1, BASE_M);
  for (const l of layers) {
    if (!l.visible || l.opacity <= 0) continue;
    const cache = getCache(T, l);
    const src = l.kind === 'paint' ? l.tex : cache;
    if (!src || !src.c) continue;
    const A = T.acc[cur], B = T.acc[1 - cur];
    const mp = l.mask ? l.mask.tex : null, mg = l.mask && l.mask.gen ? cache.g : null;
    bindTargets([B.c, B.m]);
    P.comp.use().tex('uAccC', A.c).tex('uAccM', A.m).tex('uSrcC', src.c).tex('uSrcM', src.m).tex('uMaskP', mp).tex('uMaskG', mg)
      .set('uHasMP', !!mp).set('uHasMG', !!mg).set('uOpacity', l.opacity).set('uBlend', Math.max(0, BLENDS.indexOf(l.blend)))
      .set('uHBlend', l.hblend === 'add' ? 1 : 0).set('uCh', [l.ch.c ? 1 : 0, l.ch.r ? 1 : 0, l.ch.m ? 1 : 0, l.ch.h ? 1 : 0]);
    drawFull();
    cur = 1 - cur;
  }
  return T.acc[cur];
}
function compositeMain() {
  if (!E.T) return;
  const acc = compositeTarget(E.T, S.layers);
  bindTargets([E.fin.c, E.fin.m, E.fin.n]);
  E.P.final.use().tex('uAccC', acc.c).tex('uAccM', acc.m).tex('uIsl', E.isl).tex('uBake', E.T.bake).set('uHS', S.hdepth * S.res / 8);
  drawFull();
  E.fin.c.mipmap(); E.fin.m.mipmap(); E.fin.n.mipmap();
  // Caches gelöschter Ebenen freigeben
  const ids = new Set(S.layers.map((l) => l.id));
  for (const [id, c] of E.caches) if (!ids.has(id)) { freeCache(c); E.caches.delete(id); }
  E.needComp = false; E.needDraw = true;
}

/* ---------- Kamera ---------- */
function camMatrices(r) {
  const c = S.cam;

/* ---------- Modell als OBJ (mit aktuellen UVs) ---------- */
function buildOBJ(name) {

    const a = id(vmap, V, px + ' ' + py + ' ' + pz, `v ${px} ${py} ${pz}`), b = id(tmap, T, u + ' ' + v, `vt ${u} ${v}`), c = id(nmap, N, nx + ' ' + ny + ' ' + nz, `vn ${nx} ${ny} ${nz}`);

/* ---------- Hilfe-Fenster beim Drüberhalten ---------- */
const TIP = { el: null, timer: 0, target: null };

  TIP.el = el('div', { id: 'tip' }); document.body.append(TIP.el);
  const hide = () => { clearTimeout(TIP.timer); TIP.target = null; TIP.el.classList.remove('show'); };
  document.addEventListener('mouseover', (e) => {
    const t = e.target.closest('[title],[data-tip]');
    if (!t || t === TIP.target) return;
    if (t.hasAttribute('title')) { const v = t.getAttribute('title'); t.removeAttribute('title'); if (v && !t.dataset.tip) t.dataset.tip = v; }
    if (!t.dataset.tip) return;
    hide(); TIP.target = t;
    TIP.timer = setTimeout(() => {
      if (TIP.target !== t || !document.body.contains(t)) return;
      TIP.el.innerHTML = '';
      TIP.el.append(el('b', {}, t.dataset.tip), t.dataset.key ? el('kbd', {}, t.dataset.key) : null, t.dataset.desc ? el('div', {}, t.dataset.desc) : null);
      const r = t.getBoundingClientRect(); TIP.el.classList.add('show');
      const w = TIP.el.offsetWidth, h = TIP.el.offsetHeight;
      let x = t.closest('#tools') ? r.right + 10 : r.left, y = t.closest('#tools') ? r.top : r.bottom + 8;
      if (x + w > innerWidth - 6) x = innerWidth - w - 6; if (y + h > innerHeight - 6) y = r.top - h - 8;
      TIP.el.style.left = Math.max(6, x) + 'px'; TIP.el.style.top = Math.max(6, y) + 'px';
    }, 450);
  });
  document.addEventListener('mouseout', (e) => { if (TIP.target && !TIP.target.contains(e.relatedTarget)) hide(); });
  document.addEventListener('pointerdown', hide, true);
}

async function exportTextures({ preset, size, name, aoInBase, height16, withModel }) {
  const ex = EXPORTS[preset]; const sz = size || S.res;
  if (E.needComp) compositeMain();
  const files = [];
  const out8 = new Tex(sz, sz, 'rgba8');
  const out16 = height16 ? new Tex(sz, sz, 'rgba16f') : null;
  try {
    for (const [suffix, kind] of ex.maps) {
      const sixteen = kind === 3 && height16;
      const tgt = sixteen ? out16 : out8;
      bindTargets([tgt]); gl.disable(gl.BLEND); gl.disable(gl.SCISSOR_TEST);
      E.P.export.use().tex('uC', E.fin.c).tex('uM', E.fin.m).tex('uN', E.fin.n).set('uKind', kind).set('uAOB', kind === 0 ? aoInBase : 0);
      drawFull();
      let rows, ch, bits;
      const gray = [1, 2, 3, 4, 9, 10].includes(kind), alpha = kind === 8;
      ch = gray ? 1 : alpha ? 4 : 3;
      if (sixteen) {
        const f = readF32(tgt); bits = 16; rows = new Uint8Array(sz * sz * 2);
        for (let y = 0; y < sz; y++) for (let x = 0; x < sz; x++) {
          const v = Math.round(clamp(f[((sz - 1 - y) * sz + x) * 4], 0, 1) * 65535), o = (y * sz + x) * 2;
          rows[o] = v >> 8; rows[o + 1] = v & 255;
        }
      } else {
        const px = readRGBA8(tgt); bits = 8; rows = new Uint8Array(sz * sz * ch);
        for (let y = 0; y < sz; y++) {
          const src = (sz - 1 - y) * sz * 4, dst = y * sz * ch;
          for (let x = 0; x < sz; x++) for (let c = 0; c < ch; c++) rows[dst + x * ch + c] = px[src + x * 4 + c];
        }
      }
      const png = await encodePNG(sz, sz, rows, ch, bits);
      files.push({ name: `${name}${ex.sep || '_'}${suffix}.png`, data: png, store: true });
    }
  } finally { out8.free(); if (out16) out16.free(); cleanFBOs(); }
  if (withModel) { files.push({ name: name + '.obj', data: enc.encode(buildOBJ(name)) }, { name: name + '.mtl', data: enc.encode(buildMTL(name, preset)) }); }
  const blob = await makeZip(files);
  return saveBlob(`${name}_${preset}.zip`, blob, 'export');
}

const LIB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('melonentextur', 1);
      r.onupgradeneeded = () => { const db = r.result; db.createObjectStore('meta', { keyPath: 'id' }); db.createObjectStore('data', { keyPath: 'id' }); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(store, mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction(store, mode); const st = t.objectStore(store); const r = fn(st); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); });
  },
  list() { return this.tx('meta', 'readonly', (s) => s.getAll()).then((a) => (a || []).sort((x, y) => y.date - x.date)); },
  get(id) { return this.tx('data', 'readonly', (s) => s.get(id)); },
  async put(meta, blob) { await this.tx('data', 'readwrite', (s) => s.put({ id: meta.id, blob })); await this.tx('meta', 'readwrite', (s) => s.put(meta)); },
  async del(id) { await this.tx('data', 'readwrite', (s) => s.delete(id)); await this.tx('meta', 'readwrite', (s) => s.delete(id)); },
};
function snapshotThumb() {
  try {
    renderAll();
    const r = E.regions.find((x) => x.type === '3d') || E.regions[0];
    const px = new Uint8Array(r.w * r.h * 4);
    toScreen(); gl.readPixels(r.x, r.y, r.w, r.h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const c = document.createElement('canvas'); c.width = r.w; c.height = r.h;
    const img = c.getContext('2d').createImageData(r.w, r.h);
    for (let y = 0; y < r.h; y++) img.data.set(px.subarray((r.h - 1 - y) * r.w * 4, (r.h - y) * r.w * 4), y * r.w * 4);
    c.getContext('2d').putImageData(img, 0, 0);
    const t = document.createElement('canvas'); const s = Math.min(1, 360 / Math.min(r.w, r.h));
    const side = Math.min(r.w, r.h); t.width = t.height = Math.round(side * s);
    t.getContext('2d').drawImage(c, (r.w - side) / 2, (r.h - side) / 2, side, side, 0, 0, t.width, t.height);
    return t.toDataURL('image/jpeg', 0.82);
  } catch (e) { console.error('Vorschaubild', e); return ''; }

  const num = el('input', { type: 'number', min, max, step, value: fmtNum(obj[key], step) });

  renderShelf() {

    const tile = (key, name, onclick, oncontext, on) => {
      const img = this.previews.get(key);
      const t = el('button', { class: 'tile' + (on ? ' on' : ''), title: name, onclick }, img ? el('img', { src: img, alt: '' }) : el('div', { class: 'ph' }), el('span', {}, name));
      if (oncontext) t.addEventListener('contextmenu', (e) => { e.preventDefault(); oncontext(); });
      return t;
    };

    if (this.shelfTab === 'mat') for (const [k, m] of Object.entries(MATERIALS)) if (match(m.name) && (!this.matCat || this.matCat === 'Alle' || (m.cat || 'Sonstiges') === this.matCat)) it.append(tile('m:' + k, m.name, () => this.applyMat(k), () => { S.brush.mat = k; if (S.tool !== 'paint' && S.tool !== 'fill') setTool('paint'); this.renderProps(); this.renderShelf(); toast('Pinsel malt jetzt mit ' + m.name); }, S.brush.mat === k));

  async buildPreviews() {
    const jobs = [];
    for (const [k, s] of Object.entries(SMART)) jobs.push(['s:' + k, () => layersFromSpec(s.layers, true)]);
    for (const [k, m] of Object.entries(MATERIALS)) jobs.push(['m:' + k, () => layersFromSpec([m], true)]);
    GENS.forEach((g, i) => { if (i) jobs.push(['g:' + i, () => layersFromSpec(genPreviewSpec(i), true)]); });
    let n = 0;
    for (const [key, mk] of jobs) {
      if (this.previews.has(key)) continue;
      try { this.previews.set(key, renderPreview(mk())); } catch (e) { console.error('Vorschau', key, e); }

      await sleep(20);

}

/* ---------- Anbieter ---------- */
async function geminiModel(key) {
  if (AI.cfg.model) return AI.cfg.model;
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}&pageSize=200`);
  if (!r.ok) throw new Error(r.status === 400 || r.status === 403 ? 'Der Schlüssel funktioniert nicht.' : 'Google antwortet mit ' + r.status);
  const j = await r.json();
  const ok = (j.models || []).filter((m) => (m.supportedGenerationMethods || []).includes('generateContent')).map((m) => m.name.replace('models/', ''))
    .filter((n) => /flash/.test(n) && !/image|tts|audio|live|thinking|exp|8b|embed|lite/.test(n));
  const ver = (n) => { const m = /(\d+(?:\.\d+)?)/.exec(n); return m ? +m[1] : 0; };
  ok.sort((a, b) => (ver(b) - ver(a)) || ((/preview/.test(a) ? 1 : 0) - (/preview/.test(b) ? 1 : 0)));
  const best = ok[0] || 'gemini-flash-latest';
  AI.cfg.model = best; AI.save();
  return best;
}

function aiExtractText(t) {
  const q = /["„“'»«]([^"„“'»«]+)["„“'»«]/.exec(t); if (q) return q[1].trim();

      const right = [cm.view[0], cm.view[4], cm.view[8]], up = [cm.view[1], cm.view[5], cm.view[9]];
      cam.target = V3.add(cam.target, V3.add(V3.mul(right, -dx * k), V3.mul(up, dy * k))); E.gbDirty = true;
    } else if (drag.mode === 'zoom') { cam.dist = clamp(cam.dist * Math.exp(dy * 0.01), 0.2, 50); E.gbDirty = true; }
    else if (drag.mode === 'env') { S.view.envRot += dx * 0.01; }
    else if (drag.mode === 'pan2d') { S.uv2d.pan = [S.uv2d.pan[0] + dx * dpr, S.uv2d.pan[1] - dy * dpr]; }
    E.needDraw = true;
  });
  const up = (e) => {
    if (!drag || drag.mode === 'uvkey') return;
    const d = drag; drag = null;
    if (d.mode === 'paint') {
      strokeEnd();
      const h = hitRegion(e.offsetX, e.offsetY); if (h) lastStrokeEnd = { r: h.r, x: h.x, y: h.y };
      UI.renderInfo();
    } else if (d.mode === 'mv') { moveEnd(); UI.renderInfo(); }
    else if (d.mode === 'uvdrag') { if (UVE.op) uvConfirm(); }
    else if (d.mode === 'tool') {
      const moved = Math.hypot(d.x1 - d.x0, d.y1 - d.y0) > 2 * dpr || d.pts.length > 3;
      if (isSelTool(S.tool)) {
        if (!moved) { if (!d.selMode) selectNone(); }
        else { const cvs = regionCanvas(d.r); drag = d; drawToolShape(cvs.getContext('2d'), d.r, cvXY, '#ffffff', true); drag = null; selectCanvas(cvs, d.r, d.selMode); }
      } else if (moved) {
        const cvs = regionCanvas(d.r); drag = d; drawToolShape(cvs.getContext('2d'), d.r, cvXY, '#ffffff', true); drag = null;
        applyCanvas(cvs, d.r, 0); UI.renderInfo();
      }
    }
    if (mouse) mouse.nav = false; drawOverlay();
  };
  c.addEventListener('pointerup', up);
  c.addEventListener('pointercancel', up);
  c.addEventListener('pointerleave', () => { if (mouse) mouse.inside = false; drawOverlay(); });
  c.addEventListener('wheel', (e) => {
    e.preventDefault();
    const h = hitRegion(e.offsetX, e.offsetY); if (!h) return;
    if (e.ctrlKey && BRUSH_TOOLS.includes(S.tool)) { S.brush.size = clamp(Math.round(S.brush.size * (e.deltaY < 0 ? 1.1 : 1 / 1.1)), 1, 400); UI.renderCtx(); drawOverlay(); return; }
    zoomAt(h, Math.exp(Math.sign(e.deltaY) * Math.min(Math.abs(e.deltaY), 120) * 0.0012));
  }, { passive: false });
  window.addEventListener('resize', () => { applyUIScale(); resize(); });
  new ResizeObserver(resize).observe($('#view'));

  // Tastatur
  window.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (e.key === 'Escape') {
      if (UVE.op) { uvCancel(); drag = null; return; }
      if (!$('#modal').classList.contains('hidden') && UI._modalClosable !== false && S.mesh) UI.closeModal();
      return;
    }
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    if (!$('#modal').classList.contains('hidden')) return;
    const k = e.key.toLowerCase(), ctrl = e.ctrlKey || e.metaKey;
    if (UVE.op && drag && drag.mode === 'uvkey' && e.key === 'Enter') { uvConfirm(); drag = null; return; }
    if (ctrl) {
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
      else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
      else if (k === 's') { e.preventDefault(); e.shiftKey ? saveProject() : saveToLibrary(); }
      else if (k === 'k') { e.preventDefault(); toggleAI(); }
      else if (k === 'o') { e.preventDefault(); UI.openFile('.mtex,.obj,.glb,.gltf'); }
      else if (k === 'n' && !e.shiftKey) { e.preventDefault(); UI.welcome(); }
      else if (k === 'e' && e.shiftKey) { e.preventDefault(); UI.exportDialog(); }
      else if (k === 'd' && e.shiftKey) { e.preventDefault(); UI.dupLayer(); }
      else if (k === 'c') { e.preventDefault(); copySel(false); }
      else if (k === 'x') { e.preventDefault(); copySel(true); UI.refreshAll(); }
      else if (k === 'v' && e.shiftKey) { e.preventDefault(); pasteImage(); }
      else if (k === 'v') { e.preventDefault(); pasteClip(); UI.refreshAll(); }
      else if (k === 'm') { e.preventDefault(); mergeDown(); UI.refreshAll(); }
      else if (k === 'f' && e.shiftKey) { e.preventDefault(); flattenAll(); UI.refreshAll(); }
      else if (k === 'n' && e.shiftKey) { e.preventDefault(); UI.addLayer('paint'); }
      else if (k === 'g' && e.shiftKey) { e.preventDefault(); adjQuick(1); }
      else if (k === 'i' && e.shiftKey) { e.preventDefault(); adjQuick(0); }
      else if (k === 'u' && e.shiftKey) { e.preventDefault(); UI.adjDialog(3); }
      else if (k === 'b') { e.preventDefault(); frameCamera(); S.uv2d.zoom = 0; }
      else if (k === '+' || k === '=') { e.preventDefault(); zoomView(1 / 1.25); }
      else if (k === '-') { e.preventDefault(); zoomView(1.25); }
      else if (k === 'q') { e.preventDefault(); window.close(); }
      else if (e.key === 'Delete' && e.shiftKey) { e.preventDefault(); UI.delLayer(); }
      else if (k === 'd') { e.preventDefault(); selectNone(); }
      else if (k === 'a') { e.preventDefault(); if (S.tool === 'uvmove') uvSelectAll(); else selectNone(); }
      else if (k === 'i' && !e.shiftKey) { e.preventDefault(); selectInvert(); }
      return;
    }
    if (!S.mesh) return;
    const b = S.brush;
    // Blender-Tasten: Maus über dem 2D-Fenster
    const over2d = mouse && mouse.inside && mouse.r && mouse.r.type === '2d';
    if (over2d && ['g', 'r', 's'].includes(k) && !e.altKey) {
      if (S.tool !== 'uvmove') setTool('uvmove');
      if (!UVE.sel.size) uvSelectAll();
      if (uvBegin(k, regionUV(mouse.r, mouse.lx, mouse.ly))) drag = { mode: 'uvkey', r: mouse.r };
      return;
    }
    if ((over2d || S.tool === 'uvmove') && k === 'a' && !e.altKey) {
      if (S.tool !== 'uvmove') setTool('uvmove');
      if (UVE.sel.size && UVE.sel.size === islandTris().size) { UVE.sel.clear(); uvSelChanged(); } else uvSelectAll();
      return;
    }
    const same = TOOLS.filter((t) => t !== '-' && t.key.toLowerCase() === k);
    if (same.length && !e.altKey) { const i = same.findIndex((t) => t.id === S.tool); setTool(same[(i + 1) % same.length].id); return; }
    switch (e.key) {
      case 'i': case 'I': setTool('pick'); break;
      case '[': case '{': if (e.shiftKey) b.hard = clamp(b.hard - 0.1, 0, 1); else b.size = clamp(Math.round(b.size / 1.15), 1, 400); UI.renderCtx(); drawOverlay(); break;
      case ']': case '}': if (e.shiftKey) b.hard = clamp(b.hard + 0.1, 0, 1); else b.size = clamp(Math.round(b.size * 1.15 + 0.5), 1, 400); UI.renderCtx(); drawOverlay(); break;
      case 'Home': case '0': frameCamera(); S.uv2d.zoom = 0; break;
      case 'w': case 'W': S.view.wire = !S.view.wire; UI.renderVbar(); E.needDraw = true; break;
      case 'c': case 'C': S.view.chan = (S.view.chan + 1) % CHANNELS.length; UI.renderVbar(); E.needDraw = true; break;
      case 'x': case 'X': b.mirror = b.mirror ? 0 : 1; UI.renderTools(); UI.renderCtx(); toast(b.mirror ? 'Spiegeln an' : 'Spiegeln aus'); break;
      case 'q': case 'Q': { const l = curLayer(); if (l && l.mask) { S.target = S.target === 'mask' ? 'layer' : 'mask'; UI.refreshAll(); } break; }
      case 'F1': e.preventDefault(); setLayout('3d'); break;
      case 'F2': e.preventDefault(); setLayout('2d'); break;
      case 'F3': e.preventDefault(); setLayout('split'); break;
      case 'Delete': if (E.sel) eraseSelection(); else UI.delLayer(); break;
      case 'Backspace': fillSelection(); break;
      case 'F4': e.preventDefault(); UI.layerDialog(); break;
      case 'PageUp': moveLayer(1); UI.refreshAll(); break;
      case 'PageDown': moveLayer(-1); UI.refreshAll(); break;
      default: return;
    }
  });

  // Dateien aufs Fenster ziehen
  window.addEventListener('dragover', (e) => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
  window.addEventListener('drop', (e) => {
    const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (!f) return; e.preventDefault();
    if (/^image\//.test(f.type) && S.mesh) { if (S.tool === 'decal') { createImageBitmap(f).then((img) => { E.decalImg = img; E.decalName = f.name; UI.renderCtx(); }); } else { UI.busy('Bild wird geladen …'); imageLayer(f).then(() => UI.refreshAll()).finally(() => UI.busy(null)); } return; }
    handleFile(f);
  });
}

/* ---------- Dateien öffnen ---------- */
async function handleFile(file, res) {
  const name = file.name.replace(/\.[^.]+$/, '');
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (!['obj', 'glb', 'gltf', 'mtex'].includes(ext)) { toast('Diese Datei kann Melonentextur nicht öffnen. Geht: .obj, .glb, .mtex', 'err'); return; }
  if (S.mesh && S.dirty && $('#modal').classList.contains('hidden') && !confirm('Ungespeicherte Änderungen gehen verloren. Trotzdem öffnen?')) return;
  UI.closeModal();
  UI.busy('Datei wird geladen …'); await sleep(40);
  try {
    if (ext === 'mtex') { await loadProjectBuffer(await file.arrayBuffer()); toast('Projekt geöffnet'); return; }
    const src = ext === 'obj' ? parseOBJ(await file.text()) : parseGLB(await file.arrayBuffer());
    UI.busy('Modell wird vorbereitet …'); await sleep(20);
    const mesh = finalizeMesh(src, name);
    await startProject(mesh, res || (UI._welcomeRes && UI._welcomeRes.res) || S.res || 2048, name);
  } catch (e) {
    console.error('Datei konnte nicht geladen werden', e);
    UI.busy(null);
    toast('Konnte die Datei nicht laden: ' + e.message, 'err');
    if (!S.mesh) UI.welcome();
  } finally { UI.busy(null); }
}

async function startProject(mesh, res, name, setup) {
  UI.busy('Modell wird vorbereitet …'); await sleep(40);
  if (mesh.nT > 2000000) toast('Sehr großes Modell, das kann langsam werden.', 'warn');
  S.layers = []; S.sel = null; S.target = 'layer'; resetUndo();
  S.mesh = mesh; S.res = res; S.projectName = name || mesh.name; S.projectId = null;
  uploadMesh(mesh);
  bakeMesh((m) => UI.busy(m));
  warmUp();
  UVE.sel.clear(); UVE.idx = null; E.cloneSrc = null;
  if (setup) setup();
  else { const l = newLayer('paint'); S.layers.push(l); S.sel = l.id; }
  if (!setup) frameCamera();
  S.uv2d.zoom = 0; E.gbDirty = true; E.needComp = true; S.dirty = false;
  resetUndo();
  UI.refreshAll(); UI.renderShelf();
  UI.busy(null);
  if (mesh.autoUV) toast('Das Modell hatte keine UVs. Melonentextur hat selbst welche erstellt.', 'warn');
  document.title = `${APP_NAME} – ${S.projectName}`;
}

/* ---------- Hauptschleife ---------- */
function loop() {
  requestAnimationFrame(loop);
  try {
    if (ST.on && S.brush.air && drag && drag.mode === 'paint' && ST.last && ST.op !== 3) ST.pending.push({ x: ST.last[0], y: ST.last[1], r: brushRadiusPx(), a: S.brush.angle * Math.PI / 180, s: S.brush.flow * 0.12, seed: Math.random() * 100 });
    if (ST.on && ST.pending.length) strokeFlush();
    if (E.needComp || E.needDraw) renderAll();
  } catch (e) { console.error('Zeichenfehler', e); E.needComp = false; E.needDraw = false; }
}

const nextFrame = () => new Promise((r) => requestAnimationFrame(() => r()));
function setLoad(p, msg) { const b = $('#lprog'); if (b) b.style.width = Math.round(p) + '%'; if (msg != null && $('#lmsg')) $('#lmsg').textContent = msg; }
async function main() {
  document.title = APP_NAME + ' ' + APP_VERSION;
  applyUIScale();
  await nextFrame(); await nextFrame();   // Ladebildschirm zuerst anzeigen
  try {
    setLoad(4, 'Grafikkarte wird gestartet …'); await nextFrame();
    initGL(cv());
    compilePrograms();
    initTools();
    const total = PROG_LIST.length; const t0 = performance.now();
    for (;;) {
      const pend = PROG_LIST.filter((p) => !p.ready);
      if (!pend.length) break;
      let any = false;
      for (const p of pend) { if (p.done()) { p.finish(); any = true; if (performance.now() - t0 > 0) break; } }
      setLoad(8 + 82 * (total - PROG_LIST.filter((p) => !p.ready).length) / total, `Grafik wird vorbereitet … (${total - PROG_LIST.filter((p) => !p.ready).length} von ${total})`);
      if (!any) await sleep(15); else await nextFrame();
    }
  } catch (e) {
    console.error(e);
    document.body.innerHTML = '';
    document.body.append(el('div', { style: 'padding:40px;max-width:700px;margin:auto;font:15px system-ui;color:#eee' }, el('h2', {}, 'Melonentextur kann nicht starten'), el('p', {}, e.message), el('pre', { style: 'white-space:pre-wrap;color:#999;font-size:11px' }, e.stack || '')));
    return;
  }
  setLoad(94, 'Fast fertig …'); await nextFrame();
  UI.init();
  initTooltips();
  setupInput();
  resize();
  UI.refreshAll();
  UI.renderShelf();
  requestAnimationFrame(loop);
  UI.welcome();
  setLoad(100, ''); await nextFrame();
  const ld = $('#loading'); ld.classList.add('out'); setTimeout(() => ld.remove(), 400);
  setTimeout(() => UI.buildPreviews(), 300);
  setInterval(() => UI.renderInfo(), 3000);
}
window.addEventListener('DOMContentLoaded', main);

</script>
